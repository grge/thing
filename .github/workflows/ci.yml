name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `tsc --build` typechecks every package and enforces the platform
      # boundary: core/net/store/peer compile with no DOM and no Node types.
      - run: npm run check
      - run: npm test
