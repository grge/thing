name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suite is fast and catches a broken deploy before it ships.
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /thing/
          # A repo *variable*, deliberately not a secret. The value ships in the
          # client bundle and is readable by anyone who loads the page, so
          # storing it as a secret would only buy false comfort — GitHub would
          # mask it in logs while the deployed app hands it to every visitor.
          # Treat it as rotatable. Self-hosting (turn/) is what makes it private.
          VITE_TURN_CREDENTIALS_URL: ${{ vars.TURN_CREDENTIALS_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
